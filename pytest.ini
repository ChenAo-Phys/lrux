[pytest]
minversion = 6.0
addopts = -ra -q
testpaths = tests
# fermix's CPU-fallback notice from the tests' own reference calls (matched by message:
# naming the warning class would import fermix, and with it jax, before the test
# modules set JAX_ENABLE_X64 / JAX_PLATFORMS)
filterwarnings =
    ignore:fermix. device platform:UserWarning
